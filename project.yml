name: PocketDSH

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  PocketDSHKit:
    path: Packages/PocketDSHKit

targets:
  PocketDSH:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PocketDSH
        excludes:
          - Resources/Info.plist
      - path: TierCProbe/RuntimeExecProbe.c
      - path: TierCProbe/RuntimeExecProbe.h
      # Tier D: the E2 aarch64 interpreter. It is compiled straight into the app rather than
      # built as a separate static library, so device and simulator each get their own slice
      # from the same sources. E2 needs none of the things iOS forbids: no fork, no exec, no
      # JIT - guest system calls arrive through a table of callbacks the app supplies.
      - path: e2/src
      - path: e2/include
      # The host layer: filesystem, pipes, process table and the run loop, unchanged from the
      # command-line harness. It creates no host processes - guest fork is a copy of an E2
      # machine - so it runs inside the app sandbox as-is.
      - path: e2/tools/rune.c
      # The guest root Tier D runs in: a statically linked aarch64 busybox and nothing else.
      # The full Alpine tree is hundreds of megabytes and only matters for CPython; this is
      # what makes a shell command work.
      - path: PocketDSH/Resources/alpine-root
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pocketdsh
        PRODUCT_NAME: PocketDSH
        INFOPLIST_FILE: PocketDSH/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Shipped target: bridging header exposes only the original probe, so no
        # GPL-licensed headers are even reachable.
        SWIFT_OBJC_BRIDGING_HEADER: TierCProbe/RuntimeOnly-Bridging-Header.h
        # Tier D only. Tier C is the Lab build's flag and pulls in iSH; E2 needs neither.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TIER_D_AVAILABLE"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/TierCProbe"
          - "$(SRCROOT)/e2/include"
          - "$(SRCROOT)/PocketDSH/Core/Services"
        # rune.c exposes e2_rune_main instead of main under this define.
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - E2_AS_LIBRARY
        OTHER_LDFLAGS:
          - "$(inherited)"
          - -framework
          - Foundation
          - -framework
          - UIKit
          - -framework
          - CoreLocation
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: PocketDSH/Resources/Info.plist
      properties:
        CFBundleDisplayName: PocketDSH
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSRemindersFullAccessUsageDescription: "PocketDSH can create reminders when you ask the agent to remember a task."
        NSRemindersUsageDescription: "PocketDSH can create reminders when you ask the agent to remember a task."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
    dependencies:
      - package: PocketDSHKit
        product: PocketDSHCore
      - package: PocketDSHKit
        product: LuaRuntime

  PocketDSH-Lab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PocketDSH
        excludes:
          - Resources/Info.plist
      - path: TierCProbe/ISHBridge.c
      - path: TierCProbe/ISHBridge.h
      - path: TierCProbe/ISHPersistentShell.c
      - path: TierCProbe/ISHPersistentShell.h
      - path: TierCProbe/RuntimeExecProbe.c
      - path: TierCProbe/RuntimeExecProbe.h
      - path: Vendor/iSH/rootfs
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pocketdsh.lab
        PRODUCT_NAME: PocketDSH-Lab
        INFOPLIST_FILE: PocketDSH/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Links iSH, so this target is a GPLv3 derivative work. Never ship it.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TIER_C_AVAILABLE"
        SWIFT_OBJC_BRIDGING_HEADER: TierCProbe/TierCProbe-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/iSH/include"
          - "$(SRCROOT)/TierCProbe"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/iSH/lib/$(PLATFORM_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - -lish
          - -lish_emu
          - -lfakefs
          - -lsqlite3
          - -lz
          - -framework
          - Foundation
          - -framework
          - UIKit
          - -framework
          - CoreLocation
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Lab-Info.plist
      properties:
        CFBundleDisplayName: PocketDSH Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSRemindersFullAccessUsageDescription: "PocketDSH can create reminders when you ask the agent to remember a task."
        NSRemindersUsageDescription: "PocketDSH can create reminders when you ask the agent to remember a task."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
    dependencies:
      - package: PocketDSHKit
        product: PocketDSHCore
      - package: PocketDSHKit
        product: LuaRuntime

  TierCProbe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TierCProbe
      - path: Vendor/iSH/rootfs
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tiercprobe
        PRODUCT_NAME: TierCProbe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: TierCProbe/TierCProbe-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/iSH/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/iSH/lib/$(PLATFORM_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - -lish
          - -lish_emu
          - -lfakefs
          - -lsqlite3
          - -lz
          - -framework
          - Foundation
          - -framework
          - UIKit
          - -framework
          - CoreLocation

  PocketDSHTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PocketDSHTests
    dependencies:
      - target: PocketDSH
      - package: PocketDSHKit
        product: PocketDSHCore
      - package: PocketDSHKit
        product: LuaRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pocketdsh.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PocketDSH.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PocketDSH"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PocketDSH-Lab:
    build:
      targets:
        PocketDSH-Lab: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

  PocketDSH:
    build:
      targets:
        PocketDSH: all
        PocketDSHTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: PocketDSHTests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
