name: iSH Tier C build spike

on:
  workflow_dispatch:

jobs:
  build-ish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout PocketDSH
        uses: actions/checkout@v4

      - name: Checkout iSH
        uses: actions/checkout@v4
        with:
          repository: ish-app/ish
          path: ish
          submodules: recursive
          fetch-depth: 1

      - name: Install Meson, Ninja and LLVM
        run: |
          brew install meson ninja llvm lld
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Build libish for iOS
        run: |
          set -euo pipefail
          cd ish
          xcodebuild \
            -project iSH.xcodeproj \
            -target libish \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$RUNNER_TEMP/ish-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/ish-build.log"

      - name: Build libish for iOS Simulator
        run: |
          set -euo pipefail
          cd ish
          xcodebuild \
            -project iSH.xcodeproj \
            -target libish \
            -sdk iphonesimulator \
            -arch arm64 \
            -configuration Release \
            SYMROOT="$RUNNER_TEMP/ish-derived-sim" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/ish-build-sim.log"

      - name: Link a simulator CLI smoke test
        run: |
          set -euo pipefail
          SIM_ROOT="$RUNNER_TEMP/ish-derived-sim/Release-iphonesimulator/meson"
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator clang \
            -target arm64-apple-ios17.0-simulator \
            -isysroot "$SDK" \
            -Iish \
            ish/main.c \
            "$SIM_ROOT/libish.a" \
            "$SIM_ROOT/libish_emu.a" \
            "$SIM_ROOT/libfakefs.a" \
            -lsqlite3 -lz \
            -framework Foundation \
            -framework CoreLocation \
            -framework UIKit \
            -o "$RUNNER_TEMP/ish-smoke" \
            2>&1 | tee "$RUNNER_TEMP/ish-link.log"
          file "$RUNNER_TEMP/ish-smoke"

      - name: List static libraries
        if: always()
        run: |
          find "$RUNNER_TEMP/ish-derived" "$RUNNER_TEMP/ish-derived-sim" -name '*.a' -print -exec ls -lh {} \; | tee "$RUNNER_TEMP/ish-libs.txt"

      - name: Upload libraries and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ish-tier-c-spike
          path: |
            ${{ runner.temp }}/ish-libs.txt
            ${{ runner.temp }}/ish-build.log
            ${{ runner.temp }}/ish-build-sim.log
            ${{ runner.temp }}/ish-link.log
            ${{ runner.temp }}/ish-smoke
            ${{ runner.temp }}/ish-derived/**/*.a
            ${{ runner.temp }}/ish-derived-sim/**/*.a
          if-no-files-found: warn
