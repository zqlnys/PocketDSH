name: Tier C probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: Select available Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build TierCProbe for simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project PocketDSH.xcodeproj \
            -target TierCProbe \
            -sdk iphonesimulator \
            -arch arm64 \
            -configuration Debug \
            SYMROOT="$RUNNER_TEMP/tierc-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/tierc-build.log"

      - name: Boot simulator and launch probe
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/tierc-derived/Debug-iphonesimulator/TierCProbe.app"
          test -d "$APP"
          UDID=$(python3 scripts/select_simulator.py)
          test -n "$UDID"
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --console "$UDID" com.example.tiercprobe > "$RUNNER_TEMP/tierc-console.log" 2>&1 &
          CONSOLE_PID=$!
          sleep 10
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/tierc-probe.png"
          kill "$CONSOLE_PID" >/dev/null 2>&1 || true
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'eventMessage CONTAINS[c] "TierCProbe" OR process == "TierCProbe"' > "$RUNNER_TEMP/tierc-logshow.log" 2>&1 || true
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.example.tiercprobe data 2>/dev/null || true)
          if [ -n "$CONTAINER" ]; then
            find "$CONTAINER" -maxdepth 4 -type f -printf '%p %s\n' > "$RUNNER_TEMP/tierc-container.txt" 2>&1 || true
            cat "$CONTAINER/Library/Application Support/TierCProbe/output.txt" > "$RUNNER_TEMP/tierc-output.txt" 2>&1 || true
          fi
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'eventMessage CONTAINS[c] "tiercprobe"' >> "$RUNNER_TEMP/tierc-logshow.log" 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Logs/CoreSimulator" -iname '*TierCProbe*' -mmin -10 -print -exec cp {} "$RUNNER_TEMP/" \; 2>/dev/null || true

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-c-probe
          path: |
            ${{ runner.temp }}/tierc-build.log
            ${{ runner.temp }}/tierc-console.log
            ${{ runner.temp }}/tierc-logshow.log
            ${{ runner.temp }}/tierc-output.txt
            ${{ runner.temp }}/tierc-container.txt
            ${{ runner.temp }}/TierCProbe*.ips
            ${{ runner.temp }}/tierc-probe.png
          if-no-files-found: warn
