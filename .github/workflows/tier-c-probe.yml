name: Tier C probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: Select available Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build TierCProbe for simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project PocketDSH.xcodeproj \
            -target TierCProbe \
            -sdk iphonesimulator \
            -arch arm64 \
            -configuration Debug \
            SYMROOT="$RUNNER_TEMP/tierc-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/tierc-build.log"

      - name: Boot simulator and launch probe
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/tierc-derived/Debug-iphonesimulator/TierCProbe.app"
          test -d "$APP"
          UDID=$(python3 scripts/select_simulator.py)
          test -n "$UDID"
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          timeout 180 xcrun simctl bootstatus "$UDID" -b
          timeout 60 xcrun simctl install "$UDID" "$APP"
          timeout 30 xcrun simctl launch "$UDID" com.example.tiercprobe | tee "$RUNNER_TEMP/tierc-launch.log"
          sleep 8
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/tierc-probe.png"

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-c-probe
          path: |
            ${{ runner.temp }}/tierc-build.log
            ${{ runner.temp }}/tierc-launch.log
            ${{ runner.temp }}/tierc-probe.png
          if-no-files-found: warn
